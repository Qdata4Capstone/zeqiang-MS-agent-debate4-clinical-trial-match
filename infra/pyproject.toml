[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rag-infra"
version = "0.1.0"
description = "Shared LLM-client and dataset file-I/O infrastructure (OpenAI-compatible chat completion and native Ollama completion clients, JSON/JSONL/TSV dataset-loading helpers) used across use-cases/trial_retrieval, use-cases/medqa_rag, and use-cases/strategyqa_agent."
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
  "openai>=1.30.0",
  "requests>=2.31",
  "numpy>=1.24",
]

[project.optional-dependencies]
dev = ["pytest>=7"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
