[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rag-defenses"
version = "0.1.0"
description = "Shared poisoning-defense detector classes and baseline utilities: BaseDetector, L2-norm/L2-distance/perplexity detectors, and quantile-fitting baselines used across use-cases/medqa_rag and use-cases/strategyqa_agent."
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
  "numpy>=1.24",
  "torch>=2.0.1",
  "transformers>=4.39.1",
]

[project.optional-dependencies]
dev = ["pytest>=7"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
